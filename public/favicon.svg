<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="g1" x1="12" y1="12" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="g2" x1="34" y1="12" x2="52" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="g3" x1="12" y1="34" x2="30" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="g4" x1="34" y1="34" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Container badge -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#334155" stroke-width="1.5" />

  <!-- 4-Quadrant Signal Grid -->
  <rect x="13" y="13" width="17" height="17" rx="4" fill="url(#g1)" />
  <rect x="34" y="13" width="17" height="17" rx="4" fill="url(#g2)" />
  <rect x="13" y="34" width="17" height="17" rx="4" fill="url(#g3)" />
  <rect x="34" y="34" width="17" height="17" rx="4" fill="url(#g4)" />

  <!-- Center radar ping dot -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" opacity="0.9" />
</svg>